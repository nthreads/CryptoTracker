plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}
android {
    compileSdkVersion versions.compileSdk

    defaultConfig {
        applicationId "com.nthreads.cryptotracker"

        minSdkVersion versions.minSdk
        targetSdkVersion versions.targetSdk

        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    dataBinding {
        enabled true
    }
}

dependencies {

    implementation deps.androidx.appCompat
    implementation deps.androidx.materialDesign
    implementation deps.androidx.swipeToRefresh
    implementation deps.androidx.constraintLayout

    implementation deps.androidx.splashScreen

    // ViewModel and LiveData
    implementation deps.androidx.lifecycleExt

    implementation deps.kotlin.ktx


    // Retrofit
    implementation deps.retrofit.retrofitLib
    implementation deps.retrofit.gsonConverter
    implementation deps.retrofit.rxJavaAdapter
    implementation deps.retrofit.loggingInterceptor

    // RxKotlin and RxAndroid
    implementation deps.reactivex.rxJava
    implementation deps.reactivex.rxAndroid
    //implementation deps.reactivex.rxKotlin

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}